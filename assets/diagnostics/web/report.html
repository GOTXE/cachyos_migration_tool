<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>MBP Watch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311172b'/%3E%3Cpath d='M16 42c8-20 24-20 32 0' fill='none' stroke='%2377b6ff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='42' r='5' fill='%2386efac'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="report.css?v=__CACHE_VER__">
</head>
<body>
  <main id="app">
    <section class="shell shell-loading">
      <div class="loading-card">
        <div class="eyebrow">MBP Watch</div>
        <h1>Loading dashboard</h1>
        <p>Waiting for <code>data.json</code>.</p>
      </div>
    </section>
  </main>

  <div id="digest-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>AI Digest</h2>
        <button class="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <pre id="digest-text"></pre>
      </div>
      <div class="modal-footer">
        <button id="digest-download" class="button" type="button">
          <span>💾</span> Download
        </button>
      </div>
    </div>
  </div>

  <div id="wifi-modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content wifi-modal-content">
      <div class="modal-header">
        <h2>📶 Wi-Fi Monitor</h2>
        <button class="modal-close" data-modal-close="wifi-modal" aria-label="Close modal">&times;</button>
      </div>
      <div id="wifi-modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="report.js?v=__CACHE_VER__"></script>
</body>
</html>
