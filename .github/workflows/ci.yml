name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run project tests
        run: bash tests/run.sh

      - name: ShellCheck critical errors
        run: find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
